name: Dependency Audit

# P4-E5-W3-S05-T17: pnpm audit CI for ntv — fail on HIGH/CRITICAL advisories.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday 04:00 UTC

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Create @nself workspace stubs
        run: |
          for pkg in auth-core graphql-client i18n observability ui; do
            mkdir -p stubs/@nself/$pkg
            echo '{"name":"@nself/'"$pkg"'","version":"0.0.0","main":"index.js"}' > stubs/@nself/$pkg/package.json
            echo 'module.exports = {};' > stubs/@nself/$pkg/index.js
          done
          echo 'packages:' > pnpm-workspace.yaml
          echo "  - 'stubs/@nself/*'" >> pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Dependency audit
        # CVE-2025-71330 / CVE-2025-71329 (image-size ICNS/JXL/HEIF infinite-loop DoS,
        # GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq) are ignored via package.json's
        # pnpm.auditConfig.ignoreCves: no patched release exists upstream (image-size@2.0.2
        # is npm "latest" and still vulnerable). image-size is a transitive dev/build-time
        # dependency of Metro (bundler), never exposed to untrusted runtime input in the
        # shipped app, so the risk is accepted rather than silently passing. Re-check
        # periodically for a fix: https://github.com/image-size/image-size/issues
        run: pnpm audit --audit-level=high
